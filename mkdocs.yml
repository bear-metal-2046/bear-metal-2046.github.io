site_name: Bear Metal Docs
site_url: https://bearmetalweb.github.io
theme:
  name: material
  locale: en
  logo: img/favicon.png
  favicon: img/favicon.png
  palette:
    scheme: slate
    primary: yellow
    accent: yellow
  font:
    text: Poppins
  features:
    - search.suggest
    - navigation.top
    - content.tooltips
nav: 
  - Home: 'index.md'
  - Design:
    - Design HOME: 'design/index.md'
    - COTS Library: 'design/cots-library.md'
    - CAD Fundamentals: 'design/cad-fundamentals.md'
    - Iteration Process: 'design/iteration-process.md'
    - Int. Subteam Knowledge: 'design/inter-sub-knowledge.md'
    - Mech. Challenges: 'design/mech-challenges.md'
    - Org./Doc.: 'design/org-documentation.md'
    - Physics In Design: 'design/physics-in-design.md'
    - Strat. Design: 'design/strategic-design.md'
    - Sustainability: 'design/sustainability.md'
    - External Resources: 'design/external-resources.md'
  - Electronics:
    - Electronics Home: 'electronics/index.md'
    - Motors: 'electronics/motors.md'
    - Electrical Components: 'electronics/electrical-components.md'
    - Pneumatic Components: 'electronics/pneumatic-components.md'
    - Concepts: 'electronics/concepts.md'
plugins:
    - ffc-mkdocs-video
    - search
    - social
    # figure out how to use xolonium at some point instead of default font.
extra:
  generator: false
copyright: Site founded by Matt and Corbin 🦅

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
